# Nginx stream proxy for multiple iperf3 instances.
# Copy/include this file from your main nginx.conf with: include conf.d/iperf/*.conf;

stream {
    # Backend pool of iperf3 servers running locally on incrementing ports.
    upstream iperf3_backend {
        least_conn;
        # Update this list to match the ports you install with install-iperf-services.ps1
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5004 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5005 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5006 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5007 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5008 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5009 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5010 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5011 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5012 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5013 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5014 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5015 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5016 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5017 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5018 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5019 max_fails=3 fail_timeout=10s;
    }

    # External listener; clients connect here (TCP or UDP).
    server {
        listen 5201 reuseport;
        proxy_pass iperf3_backend;
        proxy_timeout 3600s;
        proxy_connect_timeout 5s;
    }
}
