global
    maxconn 4000
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 3600s
    timeout server 3600s

frontend iperf_front
    bind *:5201
    default_backend iperf_back

backend iperf_back
    balance leastconn
    # Update this list to match the ports created by install-iperf-services.ps1
    server iperf5000 127.0.0.1:5000 check
    server iperf5001 127.0.0.1:5001 check
    server iperf5002 127.0.0.1:5002 check
    server iperf5003 127.0.0.1:5003 check
    server iperf5004 127.0.0.1:5004 check
    server iperf5005 127.0.0.1:5005 check
    server iperf5006 127.0.0.1:5006 check
    server iperf5007 127.0.0.1:5007 check
    server iperf5008 127.0.0.1:5008 check
    server iperf5009 127.0.0.1:5009 check
    server iperf5010 127.0.0.1:5010 check
    server iperf5011 127.0.0.1:5011 check
    server iperf5012 127.0.0.1:5012 check
    server iperf5013 127.0.0.1:5013 check
    server iperf5014 127.0.0.1:5014 check
    server iperf5015 127.0.0.1:5015 check
    server iperf5016 127.0.0.1:5016 check
    server iperf5017 127.0.0.1:5017 check
    server iperf5018 127.0.0.1:5018 check
    server iperf5019 127.0.0.1:5019 check
